# Dependabot — mises à jour outillées des dépendances (P1 audit 2026-11).
# Les PR Dependabot passent par la même CI que le reste du dépôt ; jamais de fusion sans CI verte.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "pytest"
        # 9.2.0 casse monkeypatch.setattr sur starlette.State : l'undo supprime
        # l'attribut dynamique au lieu de le restaurer → app.state.clock disparaît
        # en cours de session (bisect CI 2026-11-09). Épinglé en 9.1.1 dans
        # backend/pyproject.toml. À retirer après adaptation des tests
        # (pas de setattr direct sur State), puis re-bumper pytest délibérément.
        versions: [">=9.2.0"]
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
        # pytest exclu du groupe : 9.2.0 casse monkeypatch.setattr sur starlette.State
        # (bisect CI 2026-11-09, cf. commentaire dans backend/pyproject.toml).
        exclude-patterns:
          - "pytest"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
