# CI backend et frontend. Secrets générés à la volée : aucun secret stocké dans le dépôt.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      MF_ENV: test
      MF_DB_HOST: localhost
      MF_DB_PORT: "5432"
      MF_DB_NAME: minefleet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Secrets éphémères
        run: |
          echo "MF_OWNER_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MF_APP_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MF_JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - name: Amorçage de la base (rôles, extensions)
        env:
          PGHOST: localhost
          PGPASSWORD: ci-postgres-only
          POSTGRES_USER: postgres
          MF_CREATE_TEST_DB: "true"
        run: bash ../infra/db/init/00_bootstrap.sh
      - run: python -m pip install pip==26.2 && pip install -e ".[dev]" pip-audit==2.10.1
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy app
      - name: Upgrade peuplé 0004 vers head
        run: pytest -q -p no:warnings tests_migrations
      - name: Tests (migrations, RLS, autorisations générées, isolation)
        run: pytest -q -p no:warnings --cov=app --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=85
      - name: Audit des dépendances
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Permissions de l'interface alignées sur authz_matrix.yaml
        run: pip install pyyaml==6.0.3 && python ../scripts/gen_permissions.py --check
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test
      - name: Build
        run: npx vite build
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high
      # Les tests E2E métier complets nécessitent une API, PostgreSQL et des comptes seedés.
      # Seul le smoke navigateur public et sans authentification est exécuté ci-dessous.

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Installer Chromium Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke navigateur (page de connexion sans API)
        run: npx playwright test --config=playwright.smoke.config.ts
