# CI backend et frontend. Secrets générés à la volée : aucun secret stocké dans le dépôt.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      MF_ENV: test
      MF_DB_HOST: localhost
      MF_DB_PORT: "5432"
      MF_DB_NAME: minefleet_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Secrets éphémères
        run: |
          owner_password="$(openssl rand -hex 24)"
          app_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -hex 48)"
          echo "::add-mask::$owner_password"
          echo "::add-mask::$app_password"
          echo "::add-mask::$jwt_secret"
          {
            printf 'MF_OWNER_PASSWORD=%s\n' "$owner_password"
            printf 'MF_APP_PASSWORD=%s\n' "$app_password"
            printf 'MF_JWT_SECRET=%s\n' "$jwt_secret"
          } >> "$GITHUB_ENV"
      - name: Amorçage de la base (rôles, extensions)
        env:
          PGHOST: localhost
          PGPASSWORD: ci-postgres-only
          POSTGRES_USER: postgres
          MF_CREATE_TEST_DB: "true"
        run: bash ../infra/db/init/00_bootstrap.sh
      - run: python -m pip install pip==26.2 && pip install -e ".[dev]" pip-audit==2.10.1
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy app
      - name: Upgrade peuplé 0004 vers head
        run: pytest -q -p no:warnings tests_migrations
      - name: Tests (migrations, RLS, autorisations générées, isolation)
        run: pytest -q -p no:warnings --cov=app --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=85
      - name: Audit des dépendances
        run: pip-audit --skip-editable
      - name: Créer une sauvegarde synthétique pour le test de restauration
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=ci-postgres-only \
            -v "${RUNNER_TEMP}:/artifacts" \
            postgis/postgis:16-3.4 \
            pg_dump --host=127.0.0.1 --port=5432 --username=postgres \
              --format=custom --file=/artifacts/minefleet-ci.dump "$MF_DB_NAME"
      - name: Transmettre la sauvegarde synthétique au job isolé
        uses: actions/upload-artifact@v7
        with:
          name: minefleet-ci-dump
          path: ${{ runner.temp }}/minefleet-ci.dump
          retention-days: 1

  backup-restore:
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Récupérer la sauvegarde synthétique éphémère
        uses: actions/download-artifact@v8
        with:
          name: minefleet-ci-dump
          path: ${{ runner.temp }}
      - name: Construire l'image API de la révision
        run: docker build --target runtime --tag minefleet-api-restore-check:ci backend
      - name: Installer le transport de sauvegarde hors machine
        run: |
          command -v gpg >/dev/null
          if ! command -v rclone >/dev/null; then
            # Contournement panne DNS du miroir Azure des runners : bascule sur archive.ubuntu.com.
            sudo bash -c 'for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do [ -f "$f" ] && sed -i "s|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g" "$f"; done'
            ok=0
            for attempt in 1 2 3 4; do
              if sudo apt-get update && sudo apt-get install --no-install-recommends --yes rclone; then ok=1; break; fi
              echo "apt-get : tentative $attempt échouée (réseau), nouvelle tentative dans 30 s…"
              sleep 30
            done
            if [ "$ok" != "1" ]; then
              # apt hors service : repli sur le script d'installation officiel rclone (CDN rclone.org).
              echo "apt indisponible : repli sur rclone.org"
              curl -fsSL --retry 4 --retry-delay 30 -o /tmp/rclone-install.sh https://rclone.org/install.sh
              sudo bash /tmp/rclone-install.sh
            fi
          fi
          rclone version
      - name: Chiffrer, transférer, télécharger, restaurer et démarrer l'API
        run: |
          vault="${RUNNER_TEMP}/offsite-vault"
          passphrase_file="${RUNNER_TEMP}/offsite-passphrase"
          offsite_config="${RUNNER_TEMP}/offsite.env"
          rclone_config="${RUNNER_TEMP}/rclone.conf"
          backup_name="minefleet-$(date -u +%Y%m%dT%H%M%SZ).dump"
          backup_path="${RUNNER_TEMP}/${backup_name}"
          mkdir -m 700 "$vault"
          openssl rand -base64 48 > "$passphrase_file"
          chmod 600 "$passphrase_file"
          cat > "$rclone_config" <<EOF
          [ci-local]
          type = local
          EOF
          chmod 600 "$rclone_config"
          cat > "$offsite_config" <<EOF
          MF_OFFSITE_REMOTE=ci-local:${vault}
          MF_OFFSITE_PASSPHRASE_FILE=${passphrase_file}
          MF_OFFSITE_RETENTION_DAYS=1
          EOF
          chmod 600 "$offsite_config"
          cp "${RUNNER_TEMP}/minefleet-ci.dump" "$backup_path"
          export MF_OFFSITE_CONFIG_FILE="$offsite_config"
          export MF_OFFSITE_RESTORE_TMPDIR="$RUNNER_TEMP"
          export RCLONE_CONFIG="$rclone_config"
          bash infra/deploy/upload-offsite-backup.sh "$backup_path"
          test ! -e "${vault}/${backup_name}"
          test -s "${vault}/${backup_name}.gpg"
          test -s "${vault}/${backup_name}.gpg.sha256"
          bash infra/deploy/verify-offsite-backup.sh "${backup_name}.gpg" \
            --api-image minefleet-api-restore-check:ci

  ops-monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tester transitions, état atomique et reprise SMTP simulée
        run: python -m unittest discover -s tests -p 'test_ops_*.py' -v
      - name: Vérifier la syntaxe des composants de monitoring
        run: |
          python -m py_compile \
            infra/deploy/alert-state.py \
            infra/deploy/monitor_state.py \
            infra/deploy/notify-alert-smtp.py \
            infra/deploy/offsite_config.py \
            infra/deploy/run-alert-monitor.py \
            infra/deploy/release_manifest.py
          bash -n \
            infra/deploy/backup.sh \
            infra/deploy/check-preproduction.sh \
            infra/deploy/offsite-common.sh \
            infra/deploy/staging-release.sh \
            infra/deploy/upload-offsite-backup.sh \
            infra/deploy/verify-offsite-backup.sh
      - name: Valider la configuration Compose staging sans démarrage
        run: bash infra/deploy/check-preproduction.sh infra/deploy/docker-compose.prod.yml

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Permissions de l'interface alignées sur authz_matrix.yaml
        run: |
          pip install pyyaml==6.0.3
          python ../scripts/gen_permissions.py --check
          python ../scripts/generate_role_route_matrix.py --check
      - run: npm ci
      - name: Contrat OpenAPI synchronisé avec le backend
        env:
          MF_ENV: test
          MF_APP_PASSWORD: contract-check-only
          MF_JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          python -m pip install -e ../backend
          python ../scripts/export_openapi.py --output "${RUNNER_TEMP}/minefleet-openapi.json"
          npx openapi-typescript "${RUNNER_TEMP}/minefleet-openapi.json" -o src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts
      - name: Types
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test
      - name: Build
        run: npx vite build
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high
      # Les tests E2E métier complets nécessitent une API, PostgreSQL et des comptes seedés.
      # Seul le smoke navigateur public et sans authentification est exécuté ci-dessous.
  browser-smoke:
    runs-on: ubuntu-24.04
    # 20 min : les réessais réseau (apt + CDN) en cas de panne du miroir dépassent 10 min.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Installer Chromium Playwright
        run: |
          # Contournement panne DNS du miroir Azure des runners : bascule sur archive.ubuntu.com
          # avant l'installation des dépendances système par Playwright.
          sudo bash -c 'for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do [ -f "$f" ] && sed -i "s|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g" "$f"; done'
          ok=0
          for attempt in 1 2 3 4; do
            if [ "$attempt" = "1" ]; then
              if npx playwright install --with-deps chromium; then ok=1; break; fi
            else
              # Le CDN Playwright fonctionne même quand apt est en panne : tentative sans apt
              # (les bibliothèques système sont préinstallées sur les images ubuntu-latest récentes).
              if npx playwright install chromium; then ok=1; break; fi
            fi
            echo "Tentative $attempt échouée (réseau), nouvelle tentative dans 30 s…"
            sleep 30
          done
          [ "$ok" = "1" ] || { echo "Installation Chromium impossible après 4 tentatives"; exit 1; }
      - name: Smoke navigateur (page de connexion sans API)
        run: npx playwright test --config=playwright.smoke.config.ts
