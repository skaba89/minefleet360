# Environnement de développement LOCAL uniquement (aucun service externe, aucun secret commité).
# Usage : scripts/dev-up.ps1 (génère .env si absent puis lance la pile).
name: minefleet360

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      MF_OWNER_PASSWORD: ${MF_OWNER_PASSWORD:?manquant}
      MF_APP_PASSWORD: ${MF_APP_PASSWORD:?manquant}
      MF_CREATE_TEST_DB: "true"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"   # exposé sur la boucle locale uniquement
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minefleet"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../backend
      target: dev
    env_file: ../.env
    environment:
      MF_DB_HOST: db
      MF_DB_PORT: "5432"
    volumes:
      - ../backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  db-data:
