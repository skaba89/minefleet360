# Environnement serveur MINEFLEET 360 (OVH, une machine) — même configuration pour la recette et la production.
#   MF_ENV=staging    : recette, données exclusivement FICTIVES (minefleet seed-fictif)
#   MF_ENV=production : données réelles — uniquement après levée des bloquants (docs/DEPLOIEMENT_OVH.md §5)
# Lancement depuis infra/deploy : docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: minefleet

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manquant}
      MF_OWNER_PASSWORD: ${MF_OWNER_PASSWORD:?manquant}
      MF_APP_PASSWORD: ${MF_APP_PASSWORD:?manquant}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    # Aucun port publié : la base n'est joignable que depuis le réseau Docker interne.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minefleet"]
      interval: 10s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ../../backend
      target: runtime
    restart: unless-stopped
    # Moindre privilège : l'API ne reçoit que ses propres secrets (ni postgres, ni mf_owner).
    environment:
      MF_APP_PASSWORD: ${MF_APP_PASSWORD:?manquant}
      MF_JWT_SECRET: ${MF_JWT_SECRET:?manquant}
      MF_ALLOWED_ORIGINS: ${MF_ALLOWED_ORIGINS:-}
      MF_ENV: ${MF_ENV:?MF_ENV manquant (staging ou production)}
      MF_DB_HOST: db
      MF_DB_PORT: "5432"
      MF_DB_NAME: minefleet
      MF_COOKIE_SECURE: "true"
      MF_MAIL_CAPTURE_DIR: /data/mail
    volumes:
      - mail-capture:/data/mail
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      db:
        condition: service_healthy

  # Tâche ponctuelle (rôle mf_owner) : docker compose ... run --rm migrate
  migrate:
    build:
      context: ../../backend
      target: runtime
    profiles: ["ops"]
    environment:
      MF_ENV: ${MF_ENV:?MF_ENV manquant (staging ou production)}
      MF_DB_HOST: db
      MF_DB_PORT: "5432"
      MF_DB_NAME: minefleet
      MF_APP_PASSWORD: ${MF_APP_PASSWORD:?manquant}
      MF_OWNER_PASSWORD: ${MF_OWNER_PASSWORD:?manquant}
      MF_JWT_SECRET: ${MF_JWT_SECRET:?manquant}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      MF_DOMAIN: ${MF_DOMAIN:?MF_DOMAIN manquant (nom de domaine pointant vers le VPS)}
      MF_ACME_EMAIL: ${MF_ACME_EMAIL:?manquant}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  mail-capture:
  caddy-data:
  caddy-config:
