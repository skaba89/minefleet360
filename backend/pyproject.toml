[project]
name = "minefleet-api"
version = "0.1.0"
description = "MINEFLEET 360 — API (monolithe modulaire)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.10.0",  # épinglé : FastAPI ne borne pas starlette (SEC-01)
    "uvicorn[standard]==0.54.0",
    "pydantic[email]==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "psycopg[binary]==3.3.8",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",  # chiffrement AES-GCM des secrets TOTP (C-03)
    "pyjwt==2.15.1",
    "pyyaml==6.0.3",
    "tzdata==2026.6",
    "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
    # pytest épinglé en 9.1.1 : 9.2.0 casse monkeypatch.setattr sur starlette.State (l'undo supprime
    # l'attribut dynamique au lieu de le restaurer → app.state.clock disparaît en cours de session).
    # Bisect CI du 2026-11-09 ; à re-bumper après adaptation des tests (pas de setattr direct sur State).
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261103",
]

[project.scripts]
minefleet = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["authz/*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"tests_unit/**" = ["S105", "S106", "S311"]
"tests_migrations/**" = ["S105", "S106", "S311"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests_migrations/", "tests_unit/"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_unit"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
