# Source de vérité MACHINE des permissions (D-09). Vue humaine : docs/MATRICE_RBAC.md.
# Toute modification est relue par security-engineer. Les tests d'autorisation sont générés depuis ce fichier.
# grants : rôle -> portées d'attribution qui PORTENT la permission (deny-by-default : rôle absent = 403).
# Écarts assumés vs MATRICE_RBAC.md (à reporter dans la matrice) :
#  - organization.tenant.list (nouvelle) : métadonnées plateforme pour PLATFORM_ADMIN, distincte de
#    organization.tenant.read (lecture de SON tenant) pour éviter qu'un rôle tenant n'accède à /platform/*.
#  - DRIVER ne porte que les permissions « propre compte » au lot 1 (D-25) : retiré de organization.site.read.
#  - identity.session.revoke_own / revoke_any : déclarées, aucune route au lot 1a (déconnexion = /auth/logout).
#  - DRIVER sans fleet.vehicle_category.read au lot 1 (D-25). workforce.*.read_sensitive / read_number :
#    exprimés par field_policies (HR seul), sans route propre.
version: 1
tranche_courante: 1c

roles:
  PLATFORM_ADMIN: { allowed_scopes: [PLATFORM], tenant_kind: PLATFORM, assignable_by_tenant: false }
  TENANT_ADMIN:   { allowed_scopes: [TENANT], tenant_kind: CUSTOMER, assignable_by_tenant: true }
  DIRECTION:      { allowed_scopes: [TENANT], tenant_kind: CUSTOMER, assignable_by_tenant: true }
  OPS_MANAGER:    { allowed_scopes: [TENANT, SITE], tenant_kind: CUSTOMER, assignable_by_tenant: true }
  DISPATCHER:     { allowed_scopes: [SITE], tenant_kind: CUSTOMER, assignable_by_tenant: true }
  HR:             { allowed_scopes: [TENANT, SITE], tenant_kind: CUSTOMER, assignable_by_tenant: true }
  DRIVER:         { allowed_scopes: [SITE], tenant_kind: CUSTOMER, assignable_by_tenant: true }
  WORKSHOP_CHIEF: { allowed_scopes: [TENANT, SITE], tenant_kind: CUSTOMER, assignable_by_tenant: true }
  MECHANIC:       { allowed_scopes: [TENANT, SITE], tenant_kind: CUSTOMER, assignable_by_tenant: true }
  STOREKEEPER:    { allowed_scopes: [TENANT, SITE], tenant_kind: CUSTOMER, assignable_by_tenant: true }
  FUEL_MANAGER:   { allowed_scopes: [TENANT, SITE], tenant_kind: CUSTOMER, assignable_by_tenant: true }
  HSE:            { allowed_scopes: [TENANT, SITE], tenant_kind: CUSTOMER, assignable_by_tenant: true }
  FINANCE:        { allowed_scopes: [TENANT, SITE], tenant_kind: CUSTOMER, assignable_by_tenant: true }
  AUDITOR:        { allowed_scopes: [TENANT], tenant_kind: CUSTOMER, assignable_by_tenant: true, optional: true }

permissions:
  # --- organization (1a) -----------------------------------------------------------------------------
  organization.tenant.create:
    tranche: 1a
    kind: create
    site_bound: false
    routes: [{ method: POST, path: /platform/tenants, shape: collection, success: 201 }]
    audit: { action: tenant.create }
    grants: { PLATFORM_ADMIN: [PLATFORM] }
  organization.tenant.suspend:
    tranche: 1a
    kind: action
    site_bound: false
    routes:
      - { method: POST, path: "/platform/tenants/{tenant_id}/suspend", shape: item, success: 200 }
      - { method: POST, path: "/platform/tenants/{tenant_id}/reactivate", shape: item, success: 200 }
    audit: { action: tenant.suspend }
    grants: { PLATFORM_ADMIN: [PLATFORM] }
  organization.tenant.list:
    tranche: 1a
    kind: read
    site_bound: false
    routes:
      - { method: GET, path: /platform/tenants, shape: collection, success: 200 }
      - { method: GET, path: "/platform/tenants/{tenant_id}", shape: item, success: 200 }
    grants: { PLATFORM_ADMIN: [PLATFORM] }
  organization.tenant.read:
    tranche: 1a
    kind: read
    site_bound: false
    routes: [{ method: GET, path: /tenant, shape: singleton, success: 200 }]
    grants:
      TENANT_ADMIN: [TENANT]
      DIRECTION: [TENANT]
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      HR: [TENANT, SITE]
      DRIVER: [SITE]
      WORKSHOP_CHIEF: [TENANT, SITE]
      MECHANIC: [TENANT, SITE]
      STOREKEEPER: [TENANT, SITE]
      FUEL_MANAGER: [TENANT, SITE]
      HSE: [TENANT, SITE]
      FINANCE: [TENANT, SITE]
      AUDITOR: [TENANT]
  organization.tenant.update:
    tranche: 1a
    kind: update
    site_bound: false
    routes: [{ method: PATCH, path: /tenant, shape: singleton, success: 200 }]
    audit: { action: tenant.update }
    grants: { TENANT_ADMIN: [TENANT] }
  organization.site.read:
    tranche: 1a
    kind: read
    site_bound: true
    routes:
      - { method: GET, path: /sites, shape: collection, success: 200 }
      - { method: GET, path: "/sites/{site_id}", shape: item, success: 200 }
    grants:
      TENANT_ADMIN: [TENANT]
      DIRECTION: [TENANT]
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      HR: [TENANT, SITE]
      WORKSHOP_CHIEF: [SITE]
      MECHANIC: [SITE]
      STOREKEEPER: [SITE]
      FUEL_MANAGER: [SITE]
      HSE: [TENANT, SITE]
      FINANCE: [TENANT, SITE]
      AUDITOR: [TENANT]
  organization.site.create:
    tranche: 1a
    kind: create
    site_bound: false
    routes: [{ method: POST, path: /sites, shape: collection, success: 201 }]
    audit: { action: site.create }
    grants: { TENANT_ADMIN: [TENANT] }
  organization.site.update:
    tranche: 1a
    kind: update
    site_bound: true
    routes: [{ method: PATCH, path: "/sites/{site_id}", shape: item, success: 200 }]
    audit: { action: site.update }
    grants: { TENANT_ADMIN: [TENANT] }
  organization.site.deactivate:
    tranche: 1a
    kind: action
    site_bound: true
    routes:
      - { method: POST, path: "/sites/{site_id}/deactivate", shape: item, success: 200 }
      - { method: POST, path: "/sites/{site_id}/reactivate", shape: item, success: 200 }
    audit: { action: site.deactivate }
    grants: { TENANT_ADMIN: [TENANT] }

  # --- identity (1a) ---------------------------------------------------------------------------------
  identity.user.read:
    tranche: 1a
    kind: read
    site_bound: false
    routes:
      - { method: GET, path: /users, shape: collection, success: 200 }
      - { method: GET, path: "/users/{user_id}", shape: item, success: 200 }
    # HR en portée TENANT seulement : les comptes ne sont pas rattachés à un site (SEC-05).
    grants: { TENANT_ADMIN: [TENANT], HR: [TENANT], AUDITOR: [TENANT] }
  identity.user.create:
    tranche: 1a
    kind: create
    site_bound: false
    routes:
      - { method: POST, path: /users, shape: collection, success: 201 }
      - { method: POST, path: "/users/{user_id}/resend-invitation", shape: item, success: 202 }
    audit: { action: user.invite }
    grants: { TENANT_ADMIN: [TENANT] }
  identity.user.update:
    tranche: 1a
    kind: update
    site_bound: false
    routes: [{ method: PATCH, path: "/users/{user_id}", shape: item, success: 200 }]
    audit: { action: user.update }
    grants: { TENANT_ADMIN: [TENANT] }
  identity.user.deactivate:
    tranche: 1a
    kind: action
    site_bound: false
    routes:
      - { method: POST, path: "/users/{user_id}/deactivate", shape: item, success: 200 }
      - { method: POST, path: "/users/{user_id}/reactivate", shape: item, success: 200 }
    audit: { action: user.deactivate }
    grants: { TENANT_ADMIN: [TENANT] }
  identity.user.reset_credentials:
    tranche: 1a
    kind: action
    site_bound: false
    routes: [{ method: POST, path: "/users/{user_id}/reset-credentials", shape: item, success: 202 }]
    audit: { action: user.reset_credentials }
    grants: { TENANT_ADMIN: [TENANT] }
  identity.user.reset_mfa:
    tranche: 1c
    kind: action
    site_bound: false
    routes: [{ method: POST, path: "/users/{user_id}/reset-mfa", shape: item, success: 200 }]
    audit: { action: user.mfa_reset }
    grants: { TENANT_ADMIN: [TENANT] }
  identity.user.update_self:
    tranche: 1a
    kind: action
    site_bound: false
    routes:
      - { method: GET, path: /me, shape: singleton, success: 200 }
      - { method: POST, path: /me/password, shape: singleton, success: 204 }
      # Double authentification (C-03) : accessible avant l'enrôlement (seule permission dans ce cas).
      - { method: GET, path: /me/mfa, shape: singleton, success: 200 }
      - { method: POST, path: /me/mfa/setup, shape: singleton, success: 200 }
      - { method: POST, path: /me/mfa/confirm, shape: singleton, success: 200 }
      - { method: POST, path: /me/mfa/recovery-codes, shape: singleton, success: 200 }
      - { method: POST, path: /me/mfa/disable, shape: singleton, success: 204 }
    audit: { action: user.change_own_password }
    grants:
      PLATFORM_ADMIN: [PLATFORM]
      TENANT_ADMIN: [TENANT]
      DIRECTION: [TENANT]
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      HR: [TENANT, SITE]
      DRIVER: [SITE]
      WORKSHOP_CHIEF: [TENANT, SITE]
      MECHANIC: [TENANT, SITE]
      STOREKEEPER: [TENANT, SITE]
      FUEL_MANAGER: [TENANT, SITE]
      HSE: [TENANT, SITE]
      FINANCE: [TENANT, SITE]
      AUDITOR: [TENANT]
  identity.role.read:
    tranche: 1a
    kind: read
    site_bound: false
    routes: [{ method: GET, path: /roles, shape: collection, success: 200 }]
    grants: { PLATFORM_ADMIN: [PLATFORM], TENANT_ADMIN: [TENANT], DIRECTION: [TENANT], AUDITOR: [TENANT] }
  identity.role_assignment.read:
    tranche: 1a
    kind: read
    site_bound: false
    routes: [{ method: GET, path: /role-assignments, shape: collection, success: 200 }]
    grants: { TENANT_ADMIN: [TENANT], AUDITOR: [TENANT] }
  identity.role_assignment.create:
    tranche: 1a
    kind: create
    site_bound: false
    routes: [{ method: POST, path: /role-assignments, shape: collection, success: 201 }]
    audit: { action: role_assignment.create }
    grants: { TENANT_ADMIN: [TENANT] }
  identity.role_assignment.revoke:
    tranche: 1a
    kind: action
    site_bound: false
    routes: [{ method: POST, path: "/role-assignments/{assignment_id}/revoke", shape: item, success: 200 }]
    audit: { action: role_assignment.revoke }
    grants: { TENANT_ADMIN: [TENANT] }
  identity.session.revoke_own:
    tranche: 1a
    kind: action
    site_bound: false
    routes: []
    grants: {}
  identity.session.revoke_any:
    tranche: 1a
    kind: action
    site_bound: false
    routes: []
    grants: {}

  # --- audit (1a) ------------------------------------------------------------------------------------
  audit.event.read:
    tranche: 1a
    kind: read
    site_bound: false
    routes:
      - { method: GET, path: /audit-events, shape: collection, success: 200 }
      - { method: GET, path: "/audit-events/{event_id}", shape: item, success: 200 }
    grants: { TENANT_ADMIN: [TENANT], AUDITOR: [TENANT] }

  # --- fleet (1b) ------------------------------------------------------------------------------------
  fleet.vehicle_category.read:
    tranche: 1b
    kind: read
    site_bound: false
    routes:
      - { method: GET, path: /vehicle-categories, shape: collection, success: 200 }
      - { method: GET, path: "/vehicle-categories/{category_id}", shape: item, success: 200 }
      - { method: GET, path: "/vehicle-categories/{category_id}/required-documents", shape: item, success: 200 }
    grants:
      TENANT_ADMIN: [TENANT]
      DIRECTION: [TENANT]
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      HR: [TENANT, SITE]
      WORKSHOP_CHIEF: [TENANT, SITE]
      MECHANIC: [TENANT, SITE]
      STOREKEEPER: [TENANT, SITE]
      FUEL_MANAGER: [TENANT, SITE]
      HSE: [TENANT, SITE]
      FINANCE: [TENANT, SITE]
      AUDITOR: [TENANT]
  fleet.vehicle.read:
    tranche: 1b
    kind: read
    site_bound: true
    routes:
      - { method: GET, path: /vehicles, shape: collection, success: 200 }
      - { method: GET, path: "/vehicles/gps/latest", shape: collection, success: 200 }
      - { method: GET, path: "/vehicles/{vehicle_id}", shape: item, success: 200 }
      - { method: GET, path: "/vehicles/{vehicle_id}/status-history", shape: item, success: 200 }
    grants: &vehicle_readers
      TENANT_ADMIN: [TENANT]
      DIRECTION: [TENANT]
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      WORKSHOP_CHIEF: [SITE]
      MECHANIC: [SITE]
      STOREKEEPER: [SITE]
      FUEL_MANAGER: [SITE]
      HSE: [TENANT, SITE]
      FINANCE: [TENANT, SITE]
      AUDITOR: [TENANT]
  fleet.vehicle.create:
    tranche: 1b
    kind: create
    site_bound: true
    routes: [{ method: POST, path: /vehicles, shape: collection, success: 201 }]
    audit: { action: vehicle.create }
    grants: { TENANT_ADMIN: [TENANT], OPS_MANAGER: [TENANT, SITE] }
  fleet.vehicle.update:
    tranche: 1b
    kind: update
    site_bound: true
    routes: [{ method: PATCH, path: "/vehicles/{vehicle_id}", shape: item, success: 200 }]
    audit: { action: vehicle.update }
    grants: { TENANT_ADMIN: [TENANT], OPS_MANAGER: [TENANT, SITE] }
  fleet.vehicle.update_status:
    tranche: 1b
    kind: action
    site_bound: true
    routes: [{ method: POST, path: "/vehicles/{vehicle_id}/status", shape: item, success: 200 }]
    audit: { action: vehicle.change_status }
    grants: { TENANT_ADMIN: [TENANT], OPS_MANAGER: [TENANT, SITE], DISPATCHER: [SITE], WORKSHOP_CHIEF: [SITE] }
  fleet.vehicle.deactivate:
    tranche: 1b
    kind: action
    site_bound: true
    routes: [{ method: POST, path: "/vehicles/{vehicle_id}/retire", shape: item, success: 200 }]
    audit: { action: vehicle.retire }
    grants: { TENANT_ADMIN: [TENANT], OPS_MANAGER: [TENANT, SITE] }
  # Lot 2c (PLAN_LOT2 §8) : compteurs et documents réglementaires.
  fleet.meter.read:
    tranche: 1c
    kind: read
    site_bound: true
    routes: [{ method: GET, path: "/vehicles/{vehicle_id}/meter-readings", shape: item, success: 200 }]
    grants: *vehicle_readers
  fleet.meter.record:
    tranche: 1c
    kind: create
    site_bound: true
    routes: [{ method: POST, path: "/vehicles/{vehicle_id}/meter-readings", shape: item, success: 201 }]
    audit: { action: vehicle_meter.record }
    grants: { OPS_MANAGER: [TENANT, SITE], DISPATCHER: [SITE], WORKSHOP_CHIEF: [SITE], MECHANIC: [SITE] }
  fleet.document.read:
    tranche: 1c
    kind: read
    site_bound: true
    routes:
      - { method: GET, path: "/vehicles/{vehicle_id}/documents", shape: item, success: 200 }
      - { method: GET, path: /vehicle-documents, shape: collection, success: 200 }
    grants: *vehicle_readers
  fleet.document.manage:
    tranche: 1c
    kind: update
    site_bound: true
    routes:
      - { method: POST, path: "/vehicles/{vehicle_id}/documents", shape: item, success: 201 }
      - { method: POST, path: "/vehicle-documents/{vehicle_document_id}/withdraw", shape: item, success: 200 }
    # Documents immuables (revue L2C-R-02) : actions écrites vehicle_document.create et .withdraw.
    audit: { action: vehicle_document.withdraw }
    grants: { TENANT_ADMIN: [TENANT], OPS_MANAGER: [TENANT, SITE], HSE: [TENANT, SITE] }
  # D-42 : documents exigés par catégorie, décidés par l'administrateur du tenant.
  fleet.vehicle_category.manage:
    tranche: 1c
    kind: update
    site_bound: false
    routes:
      - { method: PUT, path: "/vehicle-categories/{category_id}/required-documents", shape: item, success: 200 }
    audit: { action: vehicle_category.required_documents }
    grants: { TENANT_ADMIN: [TENANT] }
  # Revue L2C-R-04 : remise à zéro d'un compteur, réservée à l'atelier et à l'exploitation.
  fleet.meter.reset:
    tranche: 1c
    kind: action
    site_bound: true
    routes: [{ method: POST, path: "/vehicles/{vehicle_id}/meter-resets", shape: item, success: 201 }]
    audit: { action: vehicle_meter.reset }
    grants: { OPS_MANAGER: [TENANT, SITE], WORKSHOP_CHIEF: [SITE] }

  # --- workforce (1b) --------------------------------------------------------------------------------
  workforce.driver.read:
    tranche: 1b
    kind: read
    site_bound: true
    routes:
      - { method: GET, path: /drivers, shape: collection, success: 200 }
      - { method: GET, path: "/drivers/{driver_id}", shape: item, success: 200 }
    grants:
      DIRECTION: [TENANT]
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      HR: [TENANT, SITE]
      WORKSHOP_CHIEF: [SITE]
      FUEL_MANAGER: [SITE]
      HSE: [TENANT, SITE]
      AUDITOR: [TENANT]
  workforce.driver.create:
    tranche: 1b
    kind: create
    site_bound: true
    routes: [{ method: POST, path: /drivers, shape: collection, success: 201 }]
    audit: { action: driver.create }
    grants: { HR: [TENANT, SITE] }
  workforce.driver.update:
    tranche: 1b
    kind: update
    site_bound: true
    routes: [{ method: PATCH, path: "/drivers/{driver_id}", shape: item, success: 200 }]
    audit: { action: driver.update }
    grants: { HR: [TENANT, SITE] }
  workforce.driver.deactivate:
    tranche: 1b
    kind: action
    site_bound: true
    routes: [{ method: POST, path: "/drivers/{driver_id}/status", shape: item, success: 200 }]
    audit: { action: driver.change_status }
    grants: { HR: [TENANT, SITE] }
  workforce.driver_license.read:
    tranche: 1b
    kind: read
    site_bound: true
    routes:
      - { method: GET, path: "/drivers/{driver_id}/licenses", shape: item, success: 200 }
      - { method: GET, path: /workforce/expirations, shape: collection, success: 200 }
    grants:
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      HR: [TENANT, SITE]
      HSE: [TENANT, SITE]
      AUDITOR: [TENANT]
  workforce.driver_license.manage:
    tranche: 1b
    kind: create
    site_bound: true
    routes:
      - { method: POST, path: "/drivers/{driver_id}/licenses", shape: item, success: 201 }
      - { method: PATCH, path: "/driver-licenses/{license_id}", shape: item, success: 200 }
    audit: { action: driver_license.create }
    grants: { HR: [TENANT, SITE] }
  workforce.driver_qualification.read:
    tranche: 1b
    kind: read
    site_bound: true
    routes: [{ method: GET, path: "/drivers/{driver_id}/qualifications", shape: item, success: 200 }]
    grants:
      DIRECTION: [TENANT]
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      HR: [TENANT, SITE]
      WORKSHOP_CHIEF: [SITE]
      HSE: [TENANT, SITE]
      AUDITOR: [TENANT]
  workforce.driver_qualification.manage:
    tranche: 1b
    kind: create
    site_bound: true
    routes: [{ method: POST, path: "/drivers/{driver_id}/qualifications", shape: item, success: 201 }]
    audit: { action: driver_qualification.create }
    grants: { HR: [TENANT, SITE] }
  workforce.driver_qualification.revoke:
    tranche: 1b
    kind: action
    site_bound: true
    routes: [{ method: POST, path: "/driver-qualifications/{qualification_id}/revoke", shape: item, success: 200 }]
    audit: { action: driver_qualification.revoke }
    grants: { HR: [TENANT, SITE] }

  # --- assignment (1c) -------------------------------------------------------------------------------
  # Lecture : matrice §2.5 (WORKSHOP_CHIEF et FUEL_MANAGER en portée SITE) ; TENANT_ADMIN, FINANCE, DRIVER : non (D-25).
  assignment.vehicle_assignment.read:
    tranche: 1c
    kind: read
    site_bound: true
    routes:
      - { method: GET, path: /vehicle-assignments, shape: collection, success: 200 }
      - { method: GET, path: "/vehicle-assignments/{vehicle_assignment_id}", shape: item, success: 200 }
      - { method: GET, path: "/vehicles/{vehicle_id}/assignments", shape: item, success: 200 }
      - { method: GET, path: "/drivers/{driver_id}/assignments", shape: item, success: 200 }
    grants:
      DIRECTION: [TENANT]
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      HR: [TENANT, SITE]
      WORKSHOP_CHIEF: [SITE]
      FUEL_MANAGER: [SITE]
      HSE: [TENANT, SITE]
      AUDITOR: [TENANT]
  assignment.vehicle_assignment.create:
    tranche: 1c
    kind: create
    site_bound: true
    routes: [{ method: POST, path: /vehicle-assignments, shape: collection, success: 201 }]
    audit: { action: vehicle_assignment.create }
    grants: { OPS_MANAGER: [TENANT, SITE], DISPATCHER: [SITE] }
  # Transitions d'une affectation en cours : prise de poste (D-27), suspension et reprise motivées (D-30).
  assignment.vehicle_assignment.update:
    tranche: 1c
    kind: action
    site_bound: true
    routes:
      - { method: POST, path: "/vehicle-assignments/{vehicle_assignment_id}/activate", shape: item, success: 200 }
      - { method: POST, path: "/vehicle-assignments/{vehicle_assignment_id}/suspend", shape: item, success: 200 }
      - { method: POST, path: "/vehicle-assignments/{vehicle_assignment_id}/resume", shape: item, success: 200 }
    audit: { action: vehicle_assignment.update }
    grants: { OPS_MANAGER: [TENANT, SITE], DISPATCHER: [SITE] }
  assignment.vehicle_assignment.end:
    tranche: 1c
    kind: action
    site_bound: true
    routes:
      - { method: POST, path: "/vehicle-assignments/{vehicle_assignment_id}/complete", shape: item, success: 200 }
      - { method: POST, path: "/vehicle-assignments/{vehicle_assignment_id}/cancel", shape: item, success: 200 }
    audit: { action: vehicle_assignment.end }
    grants: { OPS_MANAGER: [TENANT, SITE], DISPATCHER: [SITE] }

  # --- maintenance (lot 3a, docs/PLAN_LOT3.md §5) ------------------------------------------------------
  maintenance.preventive.manage:
    tranche: later
    kind: create
    site_bound: true
    routes:
      - { method: POST, path: /preventive-plans, shape: collection, success: 201 }
      - { method: POST, path: "/preventive-plans/{plan_id}/suspend", shape: item, success: 200 }
      - { method: POST, path: "/preventive-plans/{plan_id}/revise", shape: item, success: 200 }
      - { method: POST, path: "/preventive-dues/{due_id}/schedule", shape: item, success: 200 }
      - { method: POST, path: "/work-orders/{work_order_id}/complete-preventive", shape: item, success: 200 }
      - { method: GET, path: "/work-orders/{work_order_id}/preventive-completion", shape: item, success: 200 }
    # La finalisation écrit maintenance.preventive_due.complete.
    audit: { action: maintenance.plan.create }
    grants:
      OPS_MANAGER: [TENANT, SITE]
      WORKSHOP_CHIEF: [TENANT, SITE]
  maintenance.preventive.read:
    tranche: later
    kind: read
    site_bound: true
    routes:
      - { method: GET, path: "/vehicles/{vehicle_id}/preventive-plans", shape: collection, success: 200 }
      - { method: GET, path: "/vehicles/{vehicle_id}/preventive-dues", shape: collection, success: 200 }
    grants:
      DIRECTION: [TENANT]
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      WORKSHOP_CHIEF: [TENANT, SITE]
      MECHANIC: [SITE]
      AUDITOR: [TENANT]
  maintenance.work_order.read:
    tranche: 1c
    kind: read
    site_bound: true
    routes:
      - { method: GET, path: /work-orders, shape: collection, success: 200 }
      - { method: GET, path: "/work-orders/{work_order_id}", shape: item, success: 200 }
    grants:
      DIRECTION: [TENANT]
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      WORKSHOP_CHIEF: [TENANT, SITE]
      MECHANIC: [SITE]
      HSE: [TENANT, SITE]
      AUDITOR: [TENANT]
  maintenance.work_order.request:
    tranche: 1c
    kind: create
    site_bound: true
    routes: [{ method: POST, path: /work-orders, shape: collection, success: 201 }]
    audit: { action: work_order.request }
    grants:
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      WORKSHOP_CHIEF: [TENANT, SITE]
      MECHANIC: [SITE]
      HSE: [TENANT, SITE]
  maintenance.work_order.manage:
    tranche: 1c
    kind: action
    site_bound: true
    routes:
      - { method: POST, path: "/work-orders/{work_order_id}/decision", shape: item, success: 200 }
      - { method: GET, path: /maintenance-mechanics, shape: collection, success: 200 }
    # Actions écrites : work_order.approve, .reject, .assign, .cancel, .qc_pass, .qc_fail.
    audit: { action: work_order.approve }
    grants: { OPS_MANAGER: [TENANT, SITE], WORKSHOP_CHIEF: [TENANT, SITE] }
  maintenance.work_order.execute:
    tranche: 1c
    kind: action
    site_bound: true
    routes:
      - { method: POST, path: "/work-orders/{work_order_id}/progress", shape: item, success: 200 }
      - { method: POST, path: "/work-orders/{work_order_id}/labour", shape: item, success: 201 }
    # Actions écrites : work_order.start, .await_parts, .resume, .submit, .note, .labour.
    audit: { action: work_order.start }
    grants: { WORKSHOP_CHIEF: [TENANT, SITE], MECHANIC: [SITE] }

  # --- dispatch (lot 2a, docs/PLAN_LOT2.md §5) ---------------------------------------------------------
  dispatch.location.read:
    tranche: 1c
    kind: read
    site_bound: true
    routes: [{ method: GET, path: /site-locations, shape: collection, success: 200 }]
    grants: &dispatch_ref_readers
      TENANT_ADMIN: [TENANT]
      DIRECTION: [TENANT]
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      WORKSHOP_CHIEF: [TENANT, SITE]
      HSE: [TENANT, SITE]
      FINANCE: [TENANT, SITE]
      AUDITOR: [TENANT]
  dispatch.location.manage:
    tranche: 1c
    kind: create
    site_bound: true
    routes:
      - { method: POST, path: /site-locations, shape: collection, success: 201 }
      - { method: PATCH, path: "/site-locations/{site_location_id}", shape: item, success: 200 }
    audit: { action: site_location.create }
    grants: { TENANT_ADMIN: [TENANT], OPS_MANAGER: [TENANT, SITE] }
  dispatch.material.read:
    tranche: 1c
    kind: read
    site_bound: false
    routes: [{ method: GET, path: /materials, shape: collection, success: 200 }]
    grants: *dispatch_ref_readers
  dispatch.material.manage:
    tranche: 1c
    kind: create
    site_bound: false
    routes:
      - { method: POST, path: /materials, shape: collection, success: 201 }
      - { method: PATCH, path: "/materials/{material_id}", shape: item, success: 200 }
    audit: { action: material.create }
    grants: { TENANT_ADMIN: [TENANT], OPS_MANAGER: [TENANT] }
  dispatch.mission.read:
    tranche: 1c
    kind: read
    site_bound: true
    routes:
      - { method: GET, path: /missions, shape: collection, success: 200 }
      - { method: GET, path: "/missions/{mission_id}", shape: item, success: 200 }
    grants:
      DIRECTION: [TENANT]
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      WORKSHOP_CHIEF: [TENANT, SITE]
      HSE: [TENANT, SITE]
      FINANCE: [TENANT, SITE]
      AUDITOR: [TENANT]
  dispatch.mission.create:
    tranche: 1c
    kind: create
    site_bound: true
    routes: [{ method: POST, path: /missions, shape: collection, success: 201 }]
    audit: { action: mission.create }
    grants: { OPS_MANAGER: [TENANT, SITE], DISPATCHER: [SITE] }
  dispatch.mission.progress:
    tranche: 1c
    kind: action
    site_bound: true
    routes: [{ method: POST, path: "/missions/{mission_id}/events", shape: item, success: 200 }]
    # Action d'audit réellement écrite : mission.<événement> (mission.departed, mission.reassigned…).
    audit: { action: mission.progress }
    grants: { OPS_MANAGER: [TENANT, SITE], DISPATCHER: [SITE] }
  # Lot 2b (PLAN_LOT2 §7) : pesées et indicateurs. Pas de nom de conducteur dans ces réponses.
  dispatch.weighing.read:
    tranche: 1c
    kind: read
    site_bound: true
    routes:
      - { method: GET, path: /weighing-tickets, shape: collection, success: 200 }
      - { method: GET, path: "/weighing-tickets/{weighing_ticket_id}", shape: item, success: 200 }
    grants: &weighing_readers
      DIRECTION: [TENANT]
      OPS_MANAGER: [TENANT, SITE]
      DISPATCHER: [SITE]
      HSE: [TENANT, SITE]
      FINANCE: [TENANT, SITE]
      AUDITOR: [TENANT]
  dispatch.weighing.record:
    tranche: 1c
    kind: create
    site_bound: true
    routes: [{ method: POST, path: /weighing-tickets, shape: collection, success: 201 }]
    audit: { action: weighing_ticket.create }
    grants: { OPS_MANAGER: [TENANT, SITE], DISPATCHER: [SITE] }
  dispatch.weighing.approve:
    tranche: 1c
    kind: action
    site_bound: true
    routes: [{ method: POST, path: "/weighing-tickets/{weighing_ticket_id}/approve", shape: item, success: 200 }]
    audit: { action: weighing_ticket.approve }
    grants: { OPS_MANAGER: [TENANT, SITE] }
  dispatch.weighing.correct:
    tranche: 1c
    kind: action
    site_bound: true
    routes:
      - { method: POST, path: "/weighing-tickets/{weighing_ticket_id}/void", shape: item, success: 200 }
      - { method: POST, path: "/weighing-tickets/{weighing_ticket_id}/correct", shape: item, success: 201 }
    # Actions écrites : weighing_ticket.void (annulation, y compris celle de l'original lors d'une
    # correction) et weighing_ticket.correct (nouveau ticket) — revue L2B-R-10.
    audit: { action: weighing_ticket.correct }
    grants: { OPS_MANAGER: [TENANT, SITE] }
  dispatch.indicators.read:
    tranche: 1c
    kind: read
    site_bound: true
    routes: [{ method: GET, path: /dispatch-indicators, shape: collection, success: 200 }]
    grants: *weighing_readers


  # GPS : partage volontaire du compte ; conducteur limité à son affectation active côté service.
  fleet.gps.share:
    tranche: 1c
    kind: action
    site_bound: true
    routes:
      - { method: GET, path: /me/gps/vehicles, shape: collection, success: 200 }
      - { method: POST, path: /me/gps/shares, shape: collection, success: 201 }
      - { method: POST, path: "/me/gps/shares/{share_id}/positions", shape: item, success: 204 }
      - { method: POST, path: "/me/gps/shares/{share_id}/stop", shape: item, success: 204 }
    audit: { action: gps.phone.start }
    grants: { TENANT_ADMIN: [TENANT], OPS_MANAGER: [TENANT, SITE], DISPATCHER: [SITE], DRIVER: [SITE] }
  fleet.gps.manage:
    tranche: 1c
    kind: action
    site_bound: true
    routes:
      - { method: GET, path: "/vehicles/{vehicle_id}/gps/tracker", shape: item, success: 200 }
      - { method: POST, path: "/vehicles/{vehicle_id}/gps/tracker", shape: item, success: 201 }
      - { method: POST, path: "/vehicles/{vehicle_id}/gps/tracker/revoke", shape: item, success: 204 }
    audit: { action: gps.tracker.provision }
    grants: { TENANT_ADMIN: [TENANT], OPS_MANAGER: [TENANT, SITE] }
  workforce.driver.link_account:
    tranche: 1c
    kind: action
    site_bound: true
    routes:
      - { method: GET, path: "/drivers/{driver_id}/gps-account", shape: item, success: 200 }
      - { method: POST, path: "/drivers/{driver_id}/gps-account", shape: item, success: 200 }
    audit: { action: gps.driver.link_account }
    grants: { TENANT_ADMIN: [TENANT] }

